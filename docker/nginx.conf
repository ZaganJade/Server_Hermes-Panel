server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Max upload size — keep in sync with PANEL_MAX_UPLOAD_SIZE
    client_max_body_size 50M;

    # Block common probe paths early
    location ~* /\.(env|git|svn|hg|DS_Store|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeout for long-running scripts (artisan commands, etc.)
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # Catch-all dotfile guard. Keeps `.well-known/` reachable for ACME / Let's Encrypt
    # when this container is exposed directly without an upstream proxy.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # WebSocket proxy for Laravel Reverb. Reverb is started by supervisord
    # on port 8081 (see docker/supervisord.conf). Reachable as
    # ws://<host>/app/... once the front-end client is wired up.
    location /app {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
