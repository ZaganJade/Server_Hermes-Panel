services:
  hermes-panel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hermes-panel
    # Bound to loopback by default. Put a reverse proxy (Nginx, Caddy,
    # Traefik, Cloudflare Tunnel, …) in front to terminate TLS and forward
    # to 127.0.0.1:8080. To expose directly, change to "8080:8080" — but
    # only do that when PANEL_AUTH_ENABLED=true and a firewall is in
    # place, since the panel can edit files and run shell commands.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Project:/var/www/html/Project
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    restart: unless-stopped
    stdin_open: true
    tty: true

  # Optional: Panel database (uncomment if needed)
  # hermes-db:
  #   image: mysql:8.0
  #   container_name: hermes-db
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  #     MYSQL_DATABASE: hermes_panel
  #   ports:
  #     - "127.0.0.1:3306:3306"
  #   volumes:
  #     - hermes-db-data:/var/lib/mysql
  #   restart: unless-stopped

  # Optional: PostgreSQL alternative
